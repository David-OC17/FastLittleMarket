name: FastLittleMarket Coverage (GCC-13)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout + submodules (concurrentqueue, quill)
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Cache build artifacts keyed on CMakeLists changes
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build/
            ~/.cache/pip
          key: ${{ runner.os }}-gcc13-coverage-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-gcc13-coverage-

      # 3. Install system dependencies
      #    GTest is found via find_package — no manual symlinking needed
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 cmake ninja-build \
            lcov gcovr \
            libboost-all-dev \
            libgtest-dev libgmock-dev

      # 4. Install gcovr via pip to guarantee a recent version
      - name: Install gcovr
        run: pip3 install gcovr

      # 5. Export compiler variables for steps that need them explicitly
      - name: Set GCC-13 environment
        run: |
          echo "CC=gcc-13"      >> $GITHUB_ENV
          echo "CXX=g++-13"    >> $GITHUB_ENV
          echo "GCOV=gcov-13"  >> $GITHUB_ENV

      # 6. Configure — Coverage build type activates --coverage flags in CMake
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Coverage \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DBUILD_TESTS=ON \
            -G Ninja

      - name: Create Log Directory
        run: mkdir -p log

      # 7. Build
      - name: Build
        run: cmake --build build --parallel $(nproc)

      # 8. Run tests
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --schedule-random -j $(nproc)

      # 9. Generate both HTML (with per-file detail pages) and plain-text reports
      - name: Generate coverage report
        working-directory: build
        run: |
          mkdir -p ../coverage
          gcovr \
            -r .. \
            --gcov-executable gcov-13 \
            --filter ../core \
            --exclude ../test \
            --exclude '/usr/include/.*' \
            --exclude '.*external.*' \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --txt -o ../coverage/coverage.txt \
            --html --html-details \
            -o ../coverage/coverage.html

      # 10. Upload the full coverage directory (detail pages reference each other)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gcc13-${{ github.sha }}
          path: coverage/
          retention-days: 30

      # 11. Post coverage summary as a PR comment
      #     Skipped on plain pushes — createComment requires an issue/PR number
      - name: Post coverage summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage/coverage.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Coverage report\n\`\`\`\n${summary}\n\`\`\``
            });
