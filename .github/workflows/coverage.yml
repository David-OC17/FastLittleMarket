name: FastLittleMarket Coverage (GCC-13)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout + submodules (concurrentqueue, quill)
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Cache only dependency downloads, NOT the build dir.
      #    Caching build/ causes stale .gcda files to survive file renames,
      #    producing "Cannot open source file" errors in gcovr.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gcovr

      # 3. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 cmake ninja-build \
            libboost-all-dev \
            libgtest-dev libgmock-dev

      # 4. Install gcovr via pip (always fresh, no apt version pinning issues)
      - name: Install gcovr
        run: pip3 install gcovr

      # 5. Configure (always a clean build — no build/ cache means no stale artifacts)
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Coverage \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DBUILD_TESTS=ON \
            -G Ninja

      - name: Create Log Directory
        run: mkdir -p log

      # 6. Build
      - name: Build
        run: cmake --build build --parallel $(nproc)

      # 7. Run tests (logger test isolated to serial run)
      - name: Test
        working-directory: build
        run: |
          ctest --output-on-failure -j $(nproc) -E "ExchangeLoggerTest"
          ctest --output-on-failure -j 1 -R "ExchangeLoggerTest"

      # 8. Generate coverage report.
      #    --filter / --exclude use regexes, not paths.
      #    --gcov-ignore-errors=no_working_dir_found prevents a single
      #    unresolvable file from aborting the entire report.
      - name: Generate coverage report
        working-directory: build
        run: |
          mkdir -p ../coverage
          gcovr \
            -r .. \
            --object-directory . \
            --gcov-executable gcov-13 \
            --filter '.*core/.*' \
            --exclude '.*test/.*' \
            --exclude '/usr/include/.*' \
            --exclude '.*external.*' \
            --gcov-ignore-parse-errors=negative_hits.warn \
            --gcov-ignore-errors=no_working_dir_found \
            --txt -o ../coverage/coverage.txt \
            --html --html-details \
            -o ../coverage/coverage.html

      # 9. Upload the full coverage directory
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gcc13-${{ github.sha }}
          path: coverage/
          retention-days: 30

      # 10. Post coverage summary as a PR comment
      - name: Post coverage summary
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage/coverage.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Coverage report\n\`\`\`\n${summary}\n\`\`\``
            });